<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício LESS</title>

    <!-- CSS GERADO PELO LESS -->
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>Exercício LESS</h1>
        <p>Conversão de estilos para LESS usando variáveis, mapas e funções.</p>
      </header>

      <section class="content">
        <h2>Exemplo de textos</h2>
        <p class="text-primary">
          Este texto usa a cor primária vinda do mapa de cores (@colors[primary]).
        </p>
        <p class="text-secondary">
          Este texto usa a cor secundária vinda do mapa de cores (@colors[secondary]).
        </p>
      </section>

      <section class="content">
        <h2>Exemplo de botões</h2>
        <button class="btn">Botão primário</button>
        <button class="btn btn--secondary">Botão secundário</button>
      </section>

      <section class="content">
        <h2>Imagem de exemplo</h2>
        <img src="./img/produto-3.jpg" alt="Imagem de exemplo" />
      </section>
    </main>
  </body>
</html>
